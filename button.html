  <!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 넛지 약통 - 텔레그램 연동 완료판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes pulse-slow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-pulse-slow { animation: pulse-slow 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="flex flex-col lg:flex-row gap-6 items-start justify-center max-w-5xl w-full">
    
    <!-- 📱 스마트폰 화면 -->
    <div class="relative w-[340px] h-[670px] bg-slate-950 rounded-[48px] p-4 shadow-2xl border-4 border-slate-700 flex flex-col justify-between overflow-hidden mx-auto">
      <div class="bg-slate-50 w-full h-full rounded-[36px] flex flex-col justify-between p-4 overflow-hidden relative">
        
        <!-- 상단 시계 -->
        <div class="flex justify-between items-center text-[11px] text-slate-400 font-medium mb-1">
          <span>09:41</span>
          <div class="flex items-center gap-1">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-battery-full text-green-500"></i>
          </div>
        </div>

        <!-- [모드 1] 역할 선택 화면 -->
        <div id="screen-select" class="my-auto flex flex-col items-center text-center space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-2xl">💊</div>
          <div>
            <h1 class="text-xl font-extrabold text-slate-800">스마트 넛지 약통</h1>
            <p class="text-xs text-slate-400 mt-1">접속할 모드를 선택해 주세요</p>
          </div>

          <div class="w-full space-y-2 pt-2">
            <button onclick="selectRole('user')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl text-xs shadow-md transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-user"></i>
              <span>본인 모드 (약 복용자)</span>
            </button>
            <button onclick="selectRole('guardian')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl text-xs shadow-md transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-heart"></i>
              <span>보호자 모드 (실시간 모니터링)</span>
            </button>
          </div>
        </div>

        <!-- [모드 2] 본인 모드 화면 -->
        <div id="screen-user" class="hidden h-full flex flex-col justify-between">
          <div class="flex justify-between items-center border-b pb-1.5">
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full">본인 모드</span>
            <button onclick="goHome()" class="text-[10px] text-slate-400 underline">모드 변경</button>
          </div>

          <!-- 약 카드 -->
          <div class="bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm mt-2">
            <div class="flex justify-between items-center mb-1">
              <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">오늘의 복용 일정</span>
              <span id="display-time" class="text-xs font-semibold text-slate-500">아침 08:30</span>
            </div>
            <h1 id="display-name" class="text-base font-extrabold text-slate-800 truncate">비타민C & 고혈압 약 💊</h1>
            <p id="display-memo" class="text-[11px] text-slate-400 mt-0.5 truncate">식후 30분 복용 (1포)</p>
          </div>

          <!-- 캐릭터 애니메이션 -->
          <div class="my-auto flex flex-col items-center text-center">
            <div class="relative w-36 h-36 rounded-full bg-indigo-50 flex items-center justify-center border border-indigo-100 mb-2">
              <div id="user-char-waiting" class="flex flex-col items-center animate-pulse-slow">
                <span class="text-5xl">🌱</span>
                <span class="text-[11px] font-semibold text-indigo-400 mt-2">약 먹을 시간이에요!</span>
              </div>
              <div id="user-char-success" class="hidden flex-col items-center animate-pop">
                <span class="text-6xl">🌻</span>
                <span class="text-[11px] font-bold text-emerald-600 mt-2">파워 업 완료!</span>
              </div>
            </div>
            <div id="user-badge" class="px-3.5 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">⏳ 복용 대기 중</div>
          </div>

          <!-- 복용 버튼 -->
          <button onclick="pressUserPill()" class="w-full bg-indigo-600 active:bg-indigo-800 text-white font-bold py-3 rounded-2xl text-xs shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-hand-pointer"></i>
            <span>
